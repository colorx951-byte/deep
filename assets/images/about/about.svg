<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 900'>
<defs>
  <linearGradient id='ga' x1='0' y1='0' x2='1' y2='1'>
    <stop offset='0' stop-color='#2c0b0e'/>
    <stop offset='0.55' stop-color='#1a1a2e'/>
    <stop offset='1' stop-color='#0f3460'/>
  </linearGradient>
  <radialGradient id='glow' cx='50%' cy='78%' r='60%'>
    <stop offset='0' stop-color='#ff8f00' stop-opacity='0.55'/>
    <stop offset='0.5' stop-color='#d32f2f' stop-opacity='0.18'/>
    <stop offset='1' stop-color='#d32f2f' stop-opacity='0'/>
  </radialGradient>
  <linearGradient id='fl' x1='0' y1='0' x2='0' y2='1'>
    <stop offset='0' stop-color='#ffd27f'/><stop offset='0.5' stop-color='#ff8f00'/><stop offset='1' stop-color='#d32f2f'/>
  </linearGradient>
  <!-- subtle repeating flame motif -->
  <pattern id='flames' width='150' height='150' patternUnits='userSpaceOnUse' patternTransform='rotate(0)'>
    <path d='M75 35 C83 55 97 61 97 82 C97 100 88 112 75 112 C62 112 53 100 53 82 C53 72 59 66 64 60 C66 70 71 72 72 64 C73 54 70 46 75 35 Z' fill='#ffffff' opacity='0.05'/>
  </pattern>
</defs>
<rect width='1200' height='900' fill='url(#ga)'/>
<rect width='1200' height='900' fill='url(#flames)'/>
<rect width='1200' height='900' fill='url(#glow)'/>
<!-- heat waves -->
<g opacity='0.12' stroke='#ff8f00' stroke-width='3' fill='none'>
  <path d='M0 300 Q 300 250 600 300 T 1200 300'/>
  <path d='M0 360 Q 300 310 600 360 T 1200 360'/>
</g>
<!-- central flame inside a protective shield -->
<g transform='translate(600,300)'>
  <path d='M0 -150 L150 -90 V40 C150 150 90 215 0 255 C-90 215 -150 150 -150 40 V-90 Z' fill='none' stroke='#ff8f00' stroke-width='5' opacity='0.55'/>
  <g transform='translate(-70,-120) scale(1.4)'>
    <path d='M50 8 C 58 26 72 32 72 50 C 72 66 62 78 50 78 C 38 78 28 66 28 50 C 28 40 34 34 38 30 C 40 40 46 42 48 36 C 50 28 46 20 50 8 Z' fill='url(#fl)'/>
    <path d='M50 34 C 55 44 60 48 60 56 C 60 65 55 71 50 71 C 45 71 40 65 40 56 C 40 50 43 47 46 44 C 47 50 50 50 51 46 C 52 41 49 39 50 34 Z' fill='#fff3cf'/>
  </g>
</g>
<text x='600' y='770' text-anchor='middle' font-family='Poppins,Arial,sans-serif' font-size='40' font-weight='700' fill='#ffffff' opacity='0.95'>Fire &amp; Safety, Done Right</text>
<text x='600' y='818' text-anchor='middle' font-family='Poppins,Arial,sans-serif' font-size='24' fill='#ff8f00'>Jhansi, Uttar Pradesh - Serving all of India</text>
</svg>
